# typed: false
# frozen_string_literal: true

plugins:
  - rubocop-sorbet

AllCops:
  # A cop added in a later release starts pending rather than enabled, so
  # without this a rubocop upgrade quietly widens nothing.
  NewCops: enable
  # Stated rather than left to inference, which reads it off the gemspec's
  # required_ruby_version, so a cop cannot suggest syntax this repository
  # cannot run if that constraint is ever loosened.
  TargetRubyVersion: 3.4
  # Every suggestion it makes is already a decision taken here.
  SuggestExtensions: false
  Exclude:
    - 'pkg/**/*'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Sorbet:
  Enabled: true

Sorbet/EmptyLineAfterSig:
  Enabled: false

Metrics/MethodLength:
  Max: 25
  Exclude:
    - 'test/**/*.rb'

Metrics/AbcSize:
  Max: 20

Metrics/CyclomaticComplexity:
  Max: 10

Naming/HeredocDelimiterNaming:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

# Overrides for tests
Metrics/BlockLength:
  Exclude:
    - 'test/**/*.rb'
